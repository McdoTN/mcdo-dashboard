name: Repository heartbeat

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update heartbeat file
        run: |
          mkdir -p docs
          echo "Dernière vérification automatique : $(date -u +%Y-%m-%d)" > docs/last-check.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/last-check.txt
          git diff --staged --quiet || git commit -m "Heartbeat automatique (maintien du dépôt actif)"
          git push